name: Deploy Stage

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mcnamara84/grover

jobs:
  rust:
    uses: ./.github/workflows/rust-tests.yml

  browsers:
    uses: ./.github/workflows/browser-tests.yml

  publish:
    needs: [rust, browsers]
    if: github.repository == 'McNamara84/grover' && !github.event.deleted
    runs-on: ubuntu-latest
    concurrency: grover-stage-image-${{ github.sha }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or reuse the image for this commit
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-$GITHUB_SHA"
          lookup_error="$RUNNER_TEMP/manifest-error"
          if digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>"$lookup_error"); then
            echo "Reusing $tag at $digest"
          else
            # Bootstrap an absent package even if GHCR denies the initial tag lookup.
            if ! grep -Eiq 'manifest unknown|name unknown|not found|404' "$lookup_error"; then
              package_url="$GITHUB_API_URL/users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
              status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$package_url")
              if [[ "$status" != 404 ]]; then
                cat "$lookup_error" >&2
                exit 1
              fi
            fi
            metadata="$RUNNER_TEMP/build-metadata.json"
            docker buildx build --platform linux/amd64 --push --tag "$tag" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$metadata" .
            digest=$(jq -er '."containerimage.digest"' "$metadata")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  verify-image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.release-test.yml
      GROVER_TEST_IMAGE: ${{ needs.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check first, repeated and out-of-order promotions on a local Git remote
        run: bash scripts/test-stage-promotion.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published revision and start the release container
        run: |
          docker compose pull web
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$GROVER_TEST_IMAGE")
          test "$revision" = "$GITHUB_SHA"
          docker compose up -d --wait --wait-timeout 90 web
      - name: Test server rendering, assets and hydration in Chromium
        run: docker compose run --rm --build -T e2e --project=chromium home.spec.ts
      - name: Show release container logs on failure
        if: failure()
        run: docker compose logs web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-playwright-traces
          path: target/playwright/
          if-no-files-found: ignore

  promote:
    needs: [publish, verify-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance the Portainer deployment branch
        env:
          VERIFIED_IMAGE: ${{ needs.publish.outputs.image_ref }}
        run: bash scripts/promote-stage.sh "$VERIFIED_IMAGE"
